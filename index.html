
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleFinds</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 25px;
      text-align: center;
      border-bottom: 1px solid #292929;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #999;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .product {
      background: #181818;
      border-radius: 15px;
      padding: 15px;
      border: 1px solid #292929;
    }

    .product img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      background: #252525;
    }

    .product h2 {
      font-size: 18px;
    }

    .price {
      color: #aaa;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: #181818;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 25px;
      width: 100%;
      max-width: 400px;
    }

    .agent {
      margin-top: 10px;
      background: #252525;
      color: white;
    }

    .close {
      background: #333;
      color: white;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>StyleFinds</h1>
  <p>Find your next style.</p>
</header>

<section class="products">

  <div class="product">
    <img src="https://via.placeholder.com/500x500" alt="Product">
    <h2>Example Hoodie</h2>
    <div class="price">€29.99</div>
    <button onclick="openAgents()">Choose Agent</button>
  </div>

</section>

<div class="modal" id="agentModal">
  <div class="modal-box">
    <h2>Choose your agent</h2>

    <button class="agent" onclick="goToAgent('https://example.com')">
      Agent 1
    </button>

    <button class="agent" onclick="goToAgent('https://example.com')">
      Agent 2
    </button>

    <button class="agent" onclick="goToAgent('https://example.com')">
      Agent 3
    </button>

    <button class="close" onclick="closeAgents()">
      Close
    </button>
  </div>
</div>

<script>
  function openAgents() {
    document.getElementById("agentModal").style.display = "flex";
  }

  function closeAgents() {
    document.getElementById("agentModal").style.display = "none";
  }

  function goToAgent(link) {
    window.location.href = link;
  }
</script>

</body>
</html>
