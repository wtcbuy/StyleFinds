<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleFinds</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      text-align: center;
      padding: 35px 20px;
      border-bottom: 1px solid #222;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      color: #999;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: #151515;
      border: 1px solid #252525;
      border-radius: 14px;
      padding: 12px;
    }

    .product img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 10px;
      background: #222;
    }

    .product h2 {
      font-size: 17px;
      margin: 13px 4px 7px;
    }

    .price {
      color: #aaa;
      margin: 0 4px 13px;
    }

    .category {
      color: #777;
      font-size: 13px;
      margin: 0 4px 12px;
    }

    .buy {
      display: block;
      width: 100%;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      border-radius: 9px;
      background: white;
      color: black;
      font-weight: bold;
    }

    .buy:hover {
      opacity: 0.85;
    }

    #status {
      text-align: center;
      color: #888;
      margin-bottom: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>StyleFinds</h1>
  <p>Find your next piece.</p>
</header>

<div class="container">

  <div id="status">Loading finds...</div>

  <div class="products" id="products"></div>

</div>

<script>

const SHEET_ID = "1CVIDn9rfFtDyVGz1lBo1Gb1TydB921_OtGwLBlFBmwo";

const SHEET_GID = "946829648";

const SHEET_URL =
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`;


async function loadProducts() {

  try {

    const response = await fetch(SHEET_URL);

    const text = await response.text();

    const jsonText = text.substring(
      text.indexOf("{"),
      text.lastIndexOf("}") + 1
    );

    const data = JSON.parse(jsonText);

    const rows = data.table.rows;

    const products = rows.map(row => {

      const cells = row.c.map(cell =>
        cell && cell.v != null ? String(cell.v) : ""
      );

      return {
        name: cells[0],
        link: cells[1],
        price: cells[2],
        image: cells[3],
        category: cells[4],
        hot: cells[5],
        qc: cells[6],
        wtcbuy: cells[7]
      };

    }).filter(product =>
      product.name && product.image
    );

    displayProducts(products);

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Couldn't load the finds.";

  }

}


function displayProducts(products) {

  const container = document.getElementById("products");

  const status = document.getElementById("status");

  container.innerHTML = "";

  status.textContent = `${products.length} finds`;


  products.forEach(product => {

    const card = document.createElement("div");

    card.className = "product";


    const image = document.createElement("img");
    image.src = product.image;
    image.alt = product.name;
    image.loading = "lazy";


    const title = document.createElement("h2");
    title.textContent = product.name;


    const price = document.createElement("div");
    price.className = "price";
    price.textContent = `€${product.price}`;


    card.appendChild(image);
    card.appendChild(title);
    card.appendChild(price);


    if (product.category) {

      const category = document.createElement("div");

      category.className = "category";

      category.textContent = product.category;

      card.appendChild(category);

    }


    if (product.wtcbuy) {

      const button = document.createElement("a");

      button.className = "buy";

      button.href = product.wtcbuy;

      button.target = "_blank";

      button.rel = "noopener noreferrer";

      button.textContent = "Buy on WTCBuy";

      card.appendChild(button);

    } else {

      const missing = document.createElement("div");

      missing.className = "category";

      missing.textContent = "WTCBuy link coming soon";

      card.appendChild(missing);

    }


    container.appendChild(card);

  });

}


loadProducts();

</script>

</body>
</html>
