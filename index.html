<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleFinds</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 25px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #999;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: #151515;
      border: 1px solid #252525;
      border-radius: 14px;
      padding: 15px;
    }

    .product img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 10px;
      background: #222;
    }

    .product h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .price {
      color: #aaa;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .agents {
      display: none;
      margin-top: 10px;
    }

    .agents a {
      display: block;
      text-decoration: none;
      text-align: center;
      padding: 10px;
      margin-top: 7px;
      border-radius: 8px;
      background: #222;
      color: white;
    }

    .agents a:hover {
      background: #333;
    }

    #loading {
      text-align: center;
      color: #888;
    }
  </style>
</head>

<body>

<header>
  <h1>StyleFinds</h1>
  <p>Find your next piece.</p>
</header>

<div class="container">

  <p id="loading">Loading finds...</p>

  <div class="products" id="products"></div>

</div>

<script>
  /*
    YOUR GOOGLE SHEET

    We will connect your sheet here.
  */

  const SHEET_ID = "1CVIDn9rfFtDyVGz1lBo1Gb1TydB921_OtGwLBlFBmwo";

  const SHEET_GID = "946829648";

  const agents = [
    "CNFans",
    "Hipobuy",
    "WTCBuy",
    "Litbuy",
    "Oopbuy"
  ];

  /*
    Temporary example products.

    Once we connect the Sheet, these will be replaced
    automatically by your spreadsheet products.
  */

  const products = [
    {
      name: "Example Hoodie",
      image: "https://via.placeholder.com/500",
      price: "€29",
      links: {
        "CNFans": "#",
        "Hipobuy": "#",
        "WTCBuy": "#",
        "Litbuy": "#",
        "Oopbuy": "#"
      }
    }
  ];

  const productsContainer = document.getElementById("products");
  const loading = document.getElementById("loading");

  function showProducts() {

    loading.style.display = "none";

    productsContainer.innerHTML = "";

    products.forEach((product, index) => {

      const card = document.createElement("div");

      card.className = "product";

      let agentLinks = "";

      agents.forEach(agent => {

        const link = product.links[agent];

        if (link && link !== "#") {

          agentLinks += `
            <a href="${link}" target="_blank" rel="noopener">
              ${agent}
            </a>
          `;

        }

      });

      card.innerHTML = `
        <img src="${product.image}" alt="${product.name}">

        <h2>${product.name}</h2>

        <div class="price">${product.price}</div>

        <button onclick="toggleAgents(${index})">
          Choose Agent
        </button>

        <div class="agents" id="agents-${index}">
          ${agentLinks}
        </div>
      `;

      productsContainer.appendChild(card);
    });
  }

  function toggleAgents(index) {

    const box = document.getElementById("agents-" + index);

    if (box.style.display === "block") {
      box.style.display = "none";
    } else {
      box.style.display = "block";
    }
  }

  showProducts();
</script>

</body>
</html>
